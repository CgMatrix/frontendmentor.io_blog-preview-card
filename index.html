<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://gstatic.com" crossorigin />
    <link
      href="https://googleapis.com/css2?family=Figtree:ital, wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Blog preview card</title>
  </head>
  <body>
    <main class="window">
      <article class="container">
        <figure>
          <img
            class="vector_img"
            src="./assets/images/illustration-article.svg"
            alt=""
          />
        </figure>
        <div>
          <span>Learning</span>
          <p class="publish_date">Published 21 Dec 2023</p>
        </div>
        <h1>HTML & CSS foundations</h1>
        <p class="paragraph">
          These languages are the backbone of every website, defining structure, content and presentation
        </p>
        <div class="author">
          <img
            class="author_profile"
            src="./assets/images/image-avatar.webp"
            alt=""
          />
          <p class="author_name">Greg Hooper</p>
          <p></p>
        </div>
      </article>
      <footer class="attribution">
        <p>
          Challenge by
          <a class="button" href="https://www.frontendmentor.io?ref=challenge"
            >Frontend Mentor</a
          >.
        </p>
        <p>
          Coded by
          <a
            class="button"
            href="https://www.frontendmentor.io/profile/CgMatrix"
            >CgMatrix</a
          >.
        </p>
      </footer>
    </main>
  </body>
</html>
